<title>全域桌面 · Win8 动效预览（磁贴翻转 / 锁屏 / 切课过渡）</title>
<style>
  :root { --bg:#ffffff; --panel:#f5f5f5; --text:#1b1b1b; --muted:#6f6f6f; --line:#e0e0e0;
    --accent:#0078d7; --accent-dark:#006cc1; --ok:#107c10; --warn:#c42b1c;
    --ease: cubic-bezier(0.2,0,0,1); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; }
  body { font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; }

  /* ===== 通用动效（与 student/renderer/desktop.html 一致） ===== */
  @keyframes pageIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes tileIn { from { opacity:0; transform:translateY(14px) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes drawerUp { from { transform:translateY(100%); } to { transform:none; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
  @keyframes modalIn { from { opacity:0; transform:scale(.92) translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(14px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

  .statusbar { animation: pageIn .30s ease both; display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px; border-bottom:1px solid var(--line); background:#fff; }
  .sb-left { display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; color:var(--accent); }
  .sb-right { display:flex; align-items:center; gap:12px; }
  .chip { border:1px solid var(--line); padding:3px 10px; font-size:12px; color:var(--muted); }
  .chip.guard-on { color:var(--ok); border-color:#bfe5bf; background:#f0faf0; }
  .link { font-size:13px; color:var(--accent); background:none; border:0; cursor:pointer; padding:4px 6px; }
  .link:hover { text-decoration:underline; }
  .clock { font-size:15px; font-weight:600; }

  main { animation: pageIn .34s .10s ease both; flex:1; overflow:hidden; display:flex; flex-direction:column; padding:16px 24px 0; }
  .welcome h1 { font-size:22px; }
  .welcome p { color:var(--muted); font-size:13px; margin-top:2px; }
  .home-grid { flex:1; overflow-y:auto; padding:18px 0; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:18px; align-content:start; }

  /* ===== 磁贴：3D 舞台 + 双面翻转 ===== */
  .tile, .d-app { position:relative; display:block; background:transparent; border:0; padding:0;
    cursor:pointer; font-family:inherit; transform-style:preserve-3d; perspective:800px;
    animation: tileIn .32s cubic-bezier(.2,.8,.2,1) backwards; will-change:transform,opacity;
    transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease; }
  .tile { min-height:132px; }
  .tile-inner { position:relative; width:100%; min-height:132px; transform-style:preserve-3d;
    transition: transform .52s cubic-bezier(.2,.8,.2,1); }
  .tile-front, .tile-back { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; padding:12px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .tile-front { background:#eaf4fd; border:1px solid #cfe4f7; color:#005a9e; }
  .tile-back { background:var(--accent); color:#fff; transform:rotateY(180deg); }
  .tile-back .bk-nm { font-size:14px; font-weight:700; }
  .tile-back .bk-tip { font-size:12px; opacity:.9; }
  .tile:hover .tile-front { background:#d9edfb; }
  .tile .ico { width:40px; height:40px; background:var(--accent); color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center; font-weight:700; }
  .tile .nm { font-size:14px; font-weight:600; color:var(--text); max-width:100%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }

  /* 悬停：Win8 3D 微倾斜 + 微抬 + 翻转露背面 */
  .tile:hover, .d-app:hover { transform: perspective(600px) rotateX(8deg) rotateY(-3deg) translateY(-6px) scale(1.04);
    box-shadow: 0 16px 30px rgba(0,0,0,.22); z-index:2; }
  .tile:hover .tile-inner, .d-app:hover .tile-inner { transform: rotateY(180deg); }
  .tile:active, .d-app:active { transform: scale(.94); transition-duration:.06s; }

  .dock { animation: pageIn .30s .06s ease both; display:flex; align-items:center; justify-content:space-between;
    padding:10px 24px 14px; border-top:1px solid var(--line); background:#fff; }
  .dock-right { display:flex; gap:10px; flex-wrap:wrap; }
  .dock-btn { font-family:inherit; font-size:15px; padding:11px 22px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--text); display:flex; align-items:center; gap:8px; }
  .dock-btn:hover { background:var(--panel); }
  .dock-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .dock-btn.primary:hover { background:var(--accent-dark); }

  .drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; animation: fadeIn .20s ease both; }
  .drawer { position:fixed; left:0; right:0; bottom:0; max-height:78%; background:#fff; z-index:41;
    border-top:2px solid var(--accent); display:flex; flex-direction:column; animation: drawerUp .30s cubic-bezier(.2,.8,.2,1) both; }
  .drawer-head { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .drawer-head h2 { font-size:17px; }
  .drawer-body { overflow-y:auto; padding:14px 18px 22px; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:14px; }
  .d-app { min-height:96px; }
  .d-app .tile-inner { min-height:96px; }
  .d-app .tile-front { background:var(--panel); border:1px solid var(--line); color:var(--text); }
  .d-app:hover .tile-front { background:#e8eef6; }
  .d-app .tile-back .bk-nm { font-size:12px; }
  .d-app .ico { width:44px; height:44px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; }
  .d-app.sys { background:var(--panel); border:1px solid var(--line); padding:14px 6px;
    display:flex; flex-direction:column; align-items:center; gap:8px; }
  .d-app.sys:hover { background:#e8eef6; }
  .d-app.sys .ico { background:#666; }
  .d-app .nm { font-size:12px; color:var(--text); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60; display:flex; align-items:center; justify-content:center;
    animation: overlayIn .18s ease both; }
  .modal { background:#fff; width:560px; max-width:94vw; max-height:86vh; overflow:auto; padding:22px; animation: modalIn .26s cubic-bezier(.2,.9,.25,1) both; transform-origin:center; }
  .modal h3 { font-size:18px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:14px; }
  .mini { font-family:inherit; font-size:12px; padding:5px 10px; cursor:pointer; border:1px solid var(--line); background:#fff; }
  .mini.blue { background:var(--accent); color:#fff; border-color:var(--accent); }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
  .big-btn { font-family:inherit; font-size:15px; padding:10px 20px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  .big-btn.ghost { background:#fff; color:var(--text); border:1px solid var(--line); }

  .float-toast { position:fixed; bottom:74px; left:50%; transform:translateX(-50%); color:#fff;
    padding:9px 18px; z-index:99; font-size:13px; background:var(--ok); animation: toastIn .26s ease both; }

  .hint { position:fixed; top:10px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--muted);
    background:#fff; border:1px solid var(--line); padding:6px 12px; z-index:200; }

  /* ===== 锁屏过渡（与 student/renderer/styles.css 一致） ===== */
  @keyframes lockIn { from { opacity:0; } to { opacity:1; } }
  @keyframes lockCardIn { from { opacity:0; transform:scale(0.92) translateY(12px); } to { opacity:1; transform:none; } }
  .lock-overlay { position:fixed; inset:0; z-index:9999; background:rgba(12,16,24,.94);
    display:flex; align-items:center; justify-content:center; cursor:not-allowed;
    animation: lockIn 260ms var(--ease) both; }
  .lock-overlay[hidden] { display:none; }
  .lock-card { text-align:center; color:#fff; user-select:none;
    animation: lockCardIn 320ms var(--ease) both; transform-origin:center; }
  .lock-icon { display:inline-flex; width:96px; height:96px; border-radius:24px; background:var(--accent);
    color:#fff; align-items:center; justify-content:center; margin-bottom:20px; font-size:34px; font-weight:700; }
  .lock-title { font-size:28px; font-weight:700; margin:0 0 8px; }
  .lock-sub { font-size:18px; color:rgba(255,255,255,.82); margin:0; }

  /* ===== 切课全屏擦除过渡（与 student/renderer/styles.css 一致） ===== */
  @keyframes wipeSlide {
    0%   { transform: translateX(-100%); }
    45%  { transform: translateX(0); }
    55%  { transform: translateX(0); }
    100% { transform: translateX(100%); }
  }
  @keyframes wipeLabel { 0%, 100% { opacity:0; } 45%, 55% { opacity:.95; } }
  .fx-wipe { position:fixed; inset:0; z-index:10000; pointer-events:none;
    background:var(--accent); transform:translateX(-100%); }
  .fx-wipe::after { content:"全域课堂"; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:40px; font-weight:700; letter-spacing:.08em; opacity:0; }
  .fx-wipe.play { animation: wipeSlide 560ms var(--ease) both; }
  .fx-wipe.play::after { animation: wipeLabel 560ms var(--ease) both; }

  @media (prefers-reduced-motion: reduce) {
    .statusbar, .dock, main, .tile, .d-app, .tile-inner, .drawer, .drawer-mask, .overlay, .modal,
    .float-toast, .lock-overlay, .lock-card, .fx-wipe { animation:none!important; transition:none!important; }
    .tile:hover .tile-inner, .d-app:hover .tile-inner { transform:none!important; }
  }
</style>

<script>
  var APPS = [
    {name:'焊接Studio', id:'W'}, {name:'3D 建模', id:'3'}, {name:'Python 终端', id:'Py'},
    {name:'逻辑分析仪', id:'L'}, {name:'示波器', id:'O'}, {name:'电路仿真', id:'C'},
    {name:'代码编辑', id:'Co'}, {name:'数据图表', id:'D'}, {name:'摄像头', id:'V'},
    {name:'串口助手', id:'S'}, {name:'笔记', id:'N'}, {name:'帮助', id:'H'}
  ];
  // 双面结构：front 图标+名称，hover 翻转后 back 显示名称+状态提示
  function tileHtml(a, big){
    var tip = big ? '点击打开' : '课程应用';
    return '<button type="button" class="'+(big?'tile':'d-app')+'">'
      + '<span class="tile-inner">'
      + '<span class="tile-front"><span class="ico">'+a.id+'</span><span class="nm">'+a.name+'</span></span>'
      + '<span class="tile-back"><span class="bk-nm">'+a.name+'</span><span class="bk-tip">'+tip+'</span></span>'
      + '</span></button>';
  }

  var grid = document.getElementById('home-grid');
  grid.innerHTML = APPS.slice(0,6).map(function(a){ return tileHtml(a,true); }).join('');
  grid.querySelectorAll('.tile').forEach(function(el,i){ el.style.animationDelay=(i*35)+'ms'; });

  var body = document.getElementById('drawer-body');
  body.innerHTML = APPS.map(function(a){ return tileHtml(a,false); }).join('')
    + '<button type="button" class="d-app sys"><span class="ico">课</span><span class="nm">上课登记</span></button>'
    + '<button type="button" class="d-app sys"><span class="ico">设</span><span class="nm">设置</span></button>';
  body.querySelectorAll('.d-app').forEach(function(el,i){ el.style.animationDelay=(i*30)+'ms'; });

  function openDrawer(){ document.getElementById('drawer-mask').style.display='block';
    document.getElementById('drawer').style.display='flex'; }
  function closeDrawer(){ document.getElementById('drawer-mask').style.display='none';
    document.getElementById('drawer').style.display='none'; }
  function openSettings(){ document.getElementById('set-overlay').style.display='flex'; }
  function closeSettings(){ document.getElementById('set-overlay').style.display='none'; }
  function toast(text){ var e=document.createElement('div'); e.className='float-toast';
    e.textContent=text; document.body.appendChild(e); setTimeout(function(){ e.remove(); },2600); }

  // 锁屏：切换 hidden 即触发 CSS 入场动画（与产品 control.js 一样同步置位）
  function toggleLock(){ var ov=document.getElementById('lock-overlay'); ov.hidden=!ov.hidden; }

  // 切课擦除：加 .play 播放一次，结束移除（与 renderer/fx.js 同逻辑）
  function demoWipe(){
    var el=document.getElementById('fx-wipe');
    el.classList.remove('play');
    void el.offsetWidth;           /* 强制 reflow，可重复触发 */
    el.classList.add('play');
    el.addEventListener('animationend', function(){ el.classList.remove('play'); }, { once:true });
  }

  setInterval(function(){ document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); },1000);
</script>
