<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全域 · 桌面</title>
  <link rel="icon" type="image/png" href="logo-mark.png" />
  <style>
    :root {
      --bg: #ffffff; --panel: #ffffff; --text: #1b1b1b; --muted: #6f6f6f;
      --line: #e5e5e5; --accent: #0078d7; --accent-hover: #006cc1; --ok: #107c10;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    .head { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--line); }
    .head .logo { height: 40px; display: block; }
    .head-right { display: flex; align-items: center; gap: 14px; }
    .chip { border: 1px solid var(--line); padding: 5px 12px; font-size: 13px; color: var(--muted); }
    .btn { font-family: inherit; font-size: 15px; padding: 9px 20px; cursor: pointer; border: 1px solid var(--line);
      background: #fff; color: var(--text); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn.ghost:hover { background: #f3f3f3; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 24px; }
    .welcome h1 { font-size: 30px; font-weight: 700; text-align: center; }
    .welcome p { color: var(--muted); margin-top: 8px; font-size: 15px; }
    .modes { display: flex; gap: 22px; }
    .mode-card { width: 300px; min-height: 150px; border: 2px solid var(--line); background: #fff; cursor: pointer;
      font-family: inherit; font-size: 24px; font-weight: 700; padding: 26px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
    .mode-card small { font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 10px; }
    .mode-card.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .mode-card.primary small { color: rgba(255,255,255,.85); }
    .mode-card:hover { border-color: var(--accent); }
    .courses { width: 640px; max-width: 92vw; }
    .courses h2 { font-size: 15px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    .course-item { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line);
      padding: 12px 16px; margin-bottom: 8px; font-size: 16px; cursor: pointer; }
    .course-item.sel { border-color: var(--accent); background: #e8f3fb; }
    .course-item .tag { font-size: 12px; color: var(--accent); }
    footer { border-top: 1px solid var(--line); padding: 10px 28px; display: flex; gap: 26px; font-size: 13px; color: var(--muted); }
    footer b { color: var(--ok); font-weight: 600; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal { background: #fff; width: 400px; max-width: 90vw; padding: 26px; }
    .modal h3 { margin-bottom: 14px; font-size: 20px; }
    .modal label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    .modal input { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); margin-bottom: 6px; }
    .modal .err { color: #c42b1c; font-size: 13px; min-height: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="head">
    <img class="logo" src="logo-text.png" alt="全域" />
    <div class="head-right">
      <span class="chip" id="h-machine">机器加载中</span>
      <button class="btn ghost" id="btn-gear">设置</button>
    </div>
  </header>

  <main>
    <div class="welcome"><h1>欢迎使用全域</h1><p>选择进入上课模式，或自由创作（需验证口令）</p></div>
    <div class="modes">
      <button class="mode-card primary" id="btn-class">上课模式<small>进入本课全域桌面 · 按组登记学习</small></button>
      <button class="mode-card" id="btn-free">自由创作<small>退出到系统桌面</small></button>
    </div>
    <section class="courses">
      <h2>选择当前课程（老师配置）</h2>
      <div id="course-list"><div class="course-item">正在加载课程…</div></div>
    </section>
  </main>

  <footer>
    <span>机器编号：<b id="f-machine">-</b></span>
    <span>防护：<b id="f-kiosk">-</b></span>
    <span>开机自启：<b id="f-autostart">-</b></span>
  </footer>

  <div class="overlay" id="pwd-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="pwd-title">请输入口令</h3>
      <label id="pwd-hint">口令</label>
      <input id="pwd-input" type="password" autocomplete="off" />
      <div class="err" id="pwd-err"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="pwd-cancel">取消</button>
        <button class="btn primary" id="pwd-ok">确认</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="admin-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" style="width:460px;">
      <h3>系统设置</h3>
      <div class="row"><span>机器编号</span><b id="a-machine">-</b></div>
      <div class="row"><span>防护状态（Kiosk 全屏守卫）</span><b id="a-kiosk">-</b></div>
      <div class="row"><span>开机自启回到全域桌面</span><button class="btn ghost" id="a-autostart">切换</button></div>
      <div class="row"><span>退出到自由创作（系统桌面）</span><button class="btn ghost" id="a-free">退出</button></div>
      <div class="err" id="admin-err"></div>

      <h3 style="margin:16px 0 8px;font-size:16px">本机配置（老师在此设置，保存即生效）</h3>
      <div class="row"><span>自由创作口令启用</span><input id="c-exit-en" type="checkbox" style="width:auto" /></div>
      <div class="row"><span>自由创作新口令（留空不修改）</span><input id="c-exit-pwd" type="password" style="width:auto" /></div>
      <div class="row"><span>管理员口令启用</span><input id="c-admin-en" type="checkbox" style="width:auto" /></div>
      <div class="row"><span>管理员新口令（留空不修改）</span><input id="c-admin-pwd" type="password" style="width:auto" /></div>
      <div class="row"><span>课程名称</span><input id="c-course-name" type="text" style="width:60%" /></div>
      <div class="row" style="flex-direction:column;align-items:stretch">
        <span style="margin-bottom:4px">课程应用白名单（每行：显示名|exe，如 画图|mspaint.exe）</span>
        <textarea id="c-apps" rows="3" style="width:100%"></textarea>
      </div>
      <div class="row"><span>禁用进程（逗号分隔 exe）</span><input id="c-deny" type="text" style="width:55%" /></div>
      <div class="row"><span>启用禁用进程强杀</span><input id="c-guard-en" type="checkbox" style="width:auto" /></div>
      <div class="modal-actions" style="justify-content:flex-end">
        <button class="btn primary" id="c-save">保存本机桌面配置</button>
      </div>
      <div class="modal-actions">
        <button class="btn primary" id="admin-close">完成</button>
      </div>
    </div>
  </div>

  <script src="../shared/icons.js"></script>
  <script src="shell.js"></script>
</body>
</html>
