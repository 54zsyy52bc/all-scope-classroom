<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="REbY1uFlaX8NkhUThIWMrl">
<head data-page-node-id="SDVUikMrzPbsu7au5ppVin">
  <meta charset="UTF-8" data-page-node-id="xDT2JAG4DuS1FNu2JBlOm0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="ugOtxeOumEpeJetWwvhthN" />
  <title>全域 · 桌面</title>
  <link rel="icon" type="image/png" href="logo-mark.png" data-page-node-id="8mEA0mx6u378T6yg1VvrnN" />
  <!-- 磁贴/首页样式与课堂页共用一份 styles.css（学生端渲染层改造）：桌面页内联段只保留桌面专属 chrome，
       磁贴规则已搬走，避免两页漂移。link 放在内联 <style> 之前，使桌面专属变量(内联 :root)能覆盖通用 Token。 -->
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root { --bg:#ffffff; --panel:#f5f5f5; --text:#1b1b1b; --muted:#6f6f6f; --line:#e0e0e0;
      --accent:#0078d7; --accent-dark:#006cc1; --ok:#107c10; --warn:#c42b1c; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; }
    html,body { height:100%; }
    body { font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
      background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; }
    [hidden]{display:none!important}
    /* 状态条 */
    .statusbar { display:flex; align-items:center; justify-content:space-between; padding:10px 18px;
      border-bottom:1px solid var(--line); background:#fff; }
    .sb-left, .sb-right { display:flex; align-items:center; gap:12px; }
    .sb-logo { height:26px; }
    .chip { border:1px solid var(--line); padding:3px 10px; font-size:12px; color:var(--muted); }
    .chip.guard-on { color:var(--ok); border-color:#bfe5bf; background:#f0faf0; }
    .chip.guard-off { color:var(--warn); border-color:#e6b4ac; background:#fdf3f2; }
    .link { font-size:13px; color:var(--accent); background:none; border:0; cursor:pointer; padding:4px 6px; }
    .link:hover{text-decoration:underline}
    /* 主屏容器（桌面 chrome）：磁贴/首页(.welcome/.home-grid/.tile*/.d-app*/.empty-guide)
       样式已统一收进 styles.css，课堂页与桌面页共用一份，避免两页漂移。 */
    main { flex:1; overflow:hidden; display:flex; flex-direction:column; padding:16px 24px 0; }
    /* 底部 Dock */
    .dock { display:flex; align-items:center; justify-content:space-between; padding:10px 24px 14px;
      border-top:1px solid var(--line); background:#fff; }
    .dock-right { display:flex; gap:10px; }
    .dock-btn { font-family:inherit; font-size:15px; padding:11px 22px; cursor:pointer;
      border:1px solid var(--line); background:#fff; color:var(--text); display:flex; align-items:center; gap:8px; }
    .dock-btn:hover{ background:var(--panel); }
    .dock-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .dock-btn.primary:hover{ background:var(--accent-dark); }
    /* 抽屉 */
    .drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; }
    .drawer { position:fixed; left:0; right:0; bottom:0; max-height:78%; background:#fff; z-index:41;
      border-top:2px solid var(--accent); display:flex; flex-direction:column; }
    .drawer-head { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center;
      justify-content:space-between; }
    .drawer-head h2 { font-size:17px; }
    .drawer-body { overflow-y:auto; padding:14px 18px 22px; display:grid;
      grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:14px; }
    /* 抽屉内 .d-app 小磁贴样式已收进 styles.css（与首页磁贴同源） */
    /* 弹层 */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60; display:flex;
      align-items:center; justify-content:center; }
    .modal { background:#fff; width:560px; max-width:94vw; max-height:86vh; overflow:auto; padding:22px; }
    .modal h3 { font-size:18px; margin-bottom:12px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0;
      border-bottom:1px solid #f0f0f0; font-size:14px; }
    .row .path { color:var(--muted); font-size:12px; max-width:230px; overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap; }
    .mini { font-family:inherit; font-size:12px; padding:5px 10px; cursor:pointer; border:1px solid var(--line);
      background:#fff; }
    .mini.blue{ background:var(--accent); color:#fff; border-color:var(--accent); }
    .mini.danger{ color:var(--warn); border-color:#e6b4ac; }
    label.f { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    input[type=text], input[type=password], textarea { width:100%; padding:8px 10px; font-size:14px;
      border:1px solid var(--line); font-family:inherit; }
    .err { color:var(--warn); font-size:13px; min-height:18px; margin-top:6px; }
    .ok { color:var(--ok); font-size:13px; min-height:18px; margin-top:6px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
    .big-btn { font-family:inherit; font-size:15px; padding:10px 20px; border:0; background:var(--accent);
      color:#fff; cursor:pointer; }
    .big-btn.ghost { background:#fff; color:var(--text); border:1px solid var(--line); }
    .clock { font-size:15px; font-weight:600; }

    /* ===== 页面入场动效（仅桌面 chrome：状态条/底栏/主区；磁贴动效已收进 styles.css）===== */
    @keyframes pageIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .statusbar { animation: pageIn .30s ease both; }
    .dock { animation: pageIn .30s .06s ease both; }
    main { animation: pageIn .34s .10s ease both; }

    /* 抽屉滑入 + 遮罩淡入 */
    @keyframes drawerUp { from { transform:translateY(100%); } to { transform:none; } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .drawer { animation: drawerUp .30s cubic-bezier(.2,.8,.2,1) both; }
    .drawer-mask { animation: fadeIn .20s ease both; }

    /* 设置弹层：遮罩淡入 + 模态缩放淡入 */
    @keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
    @keyframes modalIn { from { opacity:0; transform:scale(.92) translateY(10px); } to { opacity:1; transform:none; } }
    .overlay { animation: overlayIn .18s ease both; }
    .modal { animation: modalIn .26s cubic-bezier(.2,.9,.25,1) both; transform-origin:center; }

    /* 浮层提示滑入 */
    @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(14px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    .float-toast { animation: toastIn .26s ease both; }

    /* 降级：尊重无障碍“减少动态” */
    @media (prefers-reduced-motion: reduce) {
      .statusbar, .dock, main, .tile, .d-app, .tile-inner, .drawer, .drawer-mask, .overlay, .modal, .float-toast
        { animation:none!important; transition:none!important; }
      .tile:hover .tile-inner, .d-app:hover .tile-inner { transform:none!important; }
    }
    /* 评审修复（可访问性）：键盘焦点可见 */
    .tile:focus-visible, .dock-btn:focus-visible, .chip:focus-visible, button:focus-visible,
    input:focus-visible, select:focus-visible {
      outline: 3px solid var(--accent); outline-offset: 2px;
    }
  </style>
</head>
