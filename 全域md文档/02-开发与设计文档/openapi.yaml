  /exports/{exportId}/files/{fileName}:
    get:
      tags: [Export]
      summary: 下载报表文件
      description: |
        **不走统一响应信封**，直接返回文件字节流。

        安全要求：`fileName` 必须经白名单校验（只允许该 `exportId` 清单内的文件名），
        禁止路径穿越（`../`）。校验失败返回 `400` + `E-VAL-01`，不要返回 404 以免泄露路径信息。
      operationId: downloadExportFile
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
        - name: fileName
          in: path
          required: true
          description: URL-encoded 文件名
          schema:
            type: string
      responses:
        '200':
          description: 文件流
          headers:
            Content-Disposition:
              description: 中文文件名需 RFC 5987 编码（`filename*=UTF-8''...`）
              schema:
                type: string
                example: "attachment; filename*=UTF-8''%E7%99%BB%E8%AE%B0%E8%A1%A8.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
                description: UTF-8 with BOM
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

