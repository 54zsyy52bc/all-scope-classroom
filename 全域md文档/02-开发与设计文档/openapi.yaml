  # ==========================================================================
  # Export
  # ==========================================================================
  /sessions/{sessionId}/exports:
    post:
      tags: [Export]
      summary: 生成报表（AC-5）
      description: |
        同步生成四类报表并落盘到 `exports/{exportId}/`，返回文件清单。
        单节课数据量（≤50 学生 / ≤250 业务消息）下同步生成耗时在百毫秒级，
        **不引入任务队列**——MVP 不做过度设计。

        | 报表 | 数据来源 |
        |------|----------|
        | 登记表 | `t_student` + 聚合 `t_equipment_borrow` |
        | 任务记录 | `t_task` + `t_task_status` |
        | 器材使用 | `t_equipment_borrow` + `t_equipment` |
        | 事件日志 | `t_event_log` |

        格式要求（04 文档 §3.3）：xlsx 由 SheetJS 生成含表头样式的多 Sheet；
        **csv 必须为 UTF-8 with BOM**，否则 Excel 打开中文乱码。
      operationId: createExport
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                formats:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [xlsx, csv]
                  default: [xlsx, csv]
                reports:
                  type: array
                  description: 缺省导出全部四类
                  items:
                    type: string
                    enum: [students, tasks, equipment, events]
            example:
              formats: [xlsx, csv]
      responses:
        '201':
          description: 生成完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExportResult'
              example:
                code: 0
                message: ''
                data:
                  exportId: E-20260830-01
                  sessionId: S-20260830-01
                  createdAt: 1693400500000
                  files:
                    - fileName: 登记表_S-20260830-01.xlsx
                      report: students
                      format: xlsx
                      sizeBytes: 18342
                      downloadUrl: /api/v1/exports/E-20260830-01/files/%E7%99%BB%E8%AE%B0%E8%A1%A8_S-20260830-01.xlsx
                    - fileName: 登记表_S-20260830-01.csv
                      report: students
                      format: csv
                      sizeBytes: 3120
                      downloadUrl: /api/v1/exports/E-20260830-01/files/%E7%99%BB%E8%AE%B0%E8%A1%A8_S-20260830-01.csv
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /exports/{exportId}:
